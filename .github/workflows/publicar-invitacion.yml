name: Publicar invitación en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener la versión del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos públicos de la invitación
        run: |
          mkdir publicacion
          cp index.html .nojekyll publicacion/
          cp -R css js assets publicacion/

      - name: Guardar archivos para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicacion

      - name: Publicar el sitio
        id: despliegue
        uses: actions/deploy-pages@v4
